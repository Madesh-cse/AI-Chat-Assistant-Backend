name: Test EC2 Connection

on:
  workflow_dispatch:

jobs:
  test-connection:
    name: Test SSH Connection
    runs-on: ubuntu-latest

    steps:
      - name: Connect to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Connected to EC2 successfully!"
            echo "Server:"
            hostname
            echo "User:"
            whoami
            echo "Project:"
            cd ~/AI-Chat-Assistant-Backend
            pwd
            echo "Git status:"
            git status